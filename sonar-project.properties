# Identificacion obligatoria del proyecto
sonar.projectKey=josecr25_Hotel_App
sonar.projectName=Hotel-App
sonar.projectVersion=1.0

# Organizacion de SonarCloud
sonar.organization=josecr25

# Codigo de la aplicacion: backend (src) e interfaz (public)
sonar.sources=src,public

# Codigo de pruebas
sonar.tests=tests,src/tests
sonar.test.inclusions=tests/**/*.js,src/tests/**/*.js

# Exclusiones
sonar.exclusions=**/node_modules/**,**/postman/**,**/*.json,src/tests/**,src/support/**,src/data/**

# Cobertura generada por las pruebas unitarias (npm run test:unit)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
