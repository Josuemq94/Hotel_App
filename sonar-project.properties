# Identificación obligatoria del proyecto
sonar.projectKey=Hotel-App
sonar.projectName=Hotel-App
sonar.projectVersion=1.0

# Carpetas de origen del código
# Analiza tanto la lógica del backend (src) como la interfaz de usuario (public)
sonar.sources=src, public

# Definición del tipo de lenguaje principal para optimizar reglas
sonar.language=js
sonar.sourceEncoding=UTF-8

# Exclusiones críticas para evitar ruido en el informe de calidad
sonar.exclusions=**/node_modules/**, **/postman/**, **/*.json