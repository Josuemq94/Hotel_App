version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: hotel_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hotel_pura_vida
    volumes:
      - mongodb_data:/data/db
    networks:
      - hotel-network
    healthcheck:
      test: mongosh --eval 'db.adminCommand("ping")'
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hotel_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/hotel_pura_vida
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

networks:
  hotel-network:
    driver: bridge

volumes:
  mongodb_data:
