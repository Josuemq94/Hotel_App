<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Hotel Pura Vida</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="landing auth-page">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <main class="auth-layout" id="main-content">
    <a class="site-logo" href="index.html">HOTEL PURA VIDA</a>
    <section class="auth-card card">
      <p class="eyebrow">ACCESO SEGURO</p>
      <h1>Iniciar sesión</h1>
      <p class="muted">Accede como cliente o administrador con tu correo y contraseña, o con tu cuenta de Google.</p>
      <form id="login-form" class="register-form">
        <label>Correo electrónico<input id="login-email" name="email" type="email" required autocomplete="email"></label>
        <label>Contraseña<input id="login-password" name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Iniciar sesión</button>
      </form>
      <p class="auth-switch">¿Aún no tienes cuenta? <a href="register.html">Regístrate como cliente</a></p>
    </section>
  </main>
  <script src="auth-page.js"></script>
  <script src="nav.js"></script>
</body>
</html>
